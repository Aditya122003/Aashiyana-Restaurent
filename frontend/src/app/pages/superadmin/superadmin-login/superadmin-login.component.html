<div class="admin-login-layout">
  <div class="login-card">
    
    <!-- Header -->
    <div class="login-header">
      <div class="admin-icon-wrap">
        <i class="ri-shield-keyhole-fill"></i>
      </div>
      <h1 class="login-title">Ashiana Superadmin</h1>
      <p class="login-subtitle">Internal Branch Pricing & Menu Management Portal</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" class="login-form">
      
      <div class="form-group">
        <label><i class="ri-user-line"></i> Admin Email / Username</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username" 
          placeholder="admin@ashiana.com or admin" 
          autocomplete="username"
          required 
        />
      </div>

      <div class="form-group">
        <label><i class="ri-lock-password-line"></i> Password</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••" 
          autocomplete="current-password"
          required 
        />
      </div>

      <div class="error-box" *ngIf="errorMessage">
        <i class="ri-error-warning-line"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="btn-primary submit-btn" [disabled]="isLoading">
        <i class="ri-login-box-line"></i>
        <span>{{ isLoading ? 'Authenticating...' : 'Sign In to Portal' }}</span>
      </button>

      <div class="quick-credentials-hint">
        <i class="ri-information-line"></i>
        <span>Default access: <code>admin&#64;ashiana.com</code> (or <code>admin</code>) / <code>ashiana&#64;1981</code></span>
      </div>

    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-link">
        <i class="ri-arrow-left-line"></i> Back to Ashiana Public Website
      </a>
    </div>

  </div>
</div>
